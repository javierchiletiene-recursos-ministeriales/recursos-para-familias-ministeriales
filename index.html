<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recursos para familias ministeriales</title>
<meta name="theme-color" content="#F6F1E7">
<style>
:root{--bg:#F6F1E7;--fg:#2B2620;--mut:#6B6255;--card:#FFFDF8;--line:#E3D9C6;--acc:#9A5B1E}
@media (prefers-color-scheme:dark){:root{--bg:#1D1A16;--fg:#F1EADD;--mut:#B3A893;--card:#27231D;--line:#3A342A;--acc:#E0A35F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}
h1{font:700 1.6rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 6px;text-wrap:balance}
p.sub{color:var(--mut);margin:0 0 24px}
.app{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.app:active,.app:hover{border-color:var(--acc)}
.app b{display:block;font-size:1.15rem;color:var(--acc)}
.app span{color:var(--mut);font-size:.95rem}
footer{color:var(--mut);font-size:.85rem;margin-top:28px}
</style></head><body><main>
<h1>Recursos para familias ministeriales</h1>
<p class="sub">Herramientas para leer, estudiar y compartir.</p>
<a class="app" href="leamos.html"><b>LeamosTxTs</b><span>Lector con voz, teleprompter, textos grabados y pasajes bíblicos.</span></a>
<footer>Tus datos se guardan solo en tu dispositivo.</footer>
</main></body></html>
